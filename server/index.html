<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>App Monitor Dashboard</title>
    <style>
      :root {
        --bg: #07111f;
        --bg-2: #0f172a;
        --panel: rgba(15, 23, 42, 0.9);
        --panel-strong: #111827;
        --panel-soft: rgba(30, 41, 59, 0.9);
        --line: rgba(148, 163, 184, 0.18);
        --primary: #60a5fa;
        --primary-2: #3b82f6;
        --success: #34d399;
        --warning: #fbbf24;
        --danger: #f87171;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --shadow: rgba(15, 23, 42, 0.5);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        font-family: Inter, "Segoe UI", Arial, sans-serif;
        background:
          radial-gradient(circle at top left, rgba(59, 130, 246, 0.12), transparent 30%),
          radial-gradient(circle at top right, rgba(52, 211, 153, 0.08), transparent 25%),
          linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
        color: var(--text);
        min-height: 100vh;
      }

      body {
        padding: 32px 20px 48px;
      }

      .container {
        max-width: 1300px;
        margin: 0 auto;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 24px;
        padding: 14px 18px;
        border: 1px solid var(--line);
        background: rgba(15, 23, 42, 0.7);
        border-radius: 18px;
        backdrop-filter: blur(14px);
        box-shadow: 0 18px 40px var(--shadow);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .brand-mark {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, var(--primary), var(--primary-2));
        color: white;
        font-weight: 700;
        box-shadow: 0 12px 25px rgba(59, 130, 246, 0.4);
      }

      .brand h1 {
        margin: 0;
        font-size: 1.25rem;
        letter-spacing: 0.02em;
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: rgba(52, 211, 153, 0.08);
        border: 1px solid rgba(52, 211, 153, 0.25);
        color: var(--success);
        padding: 9px 12px;
        border-radius: 999px;
        font-size: 0.8rem;
        font-weight: 600;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--success);
        box-shadow: 0 0 12px rgba(52, 211, 153, 0.9);
      }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 18px;
        margin-bottom: 22px;
      }

      .stat-card {
        position: relative;
        overflow: hidden;
        background: linear-gradient(180deg, rgba(15, 23, 42, 0.95), rgba(17, 24, 39, 0.8));
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 18px 18px 16px;
        box-shadow: 0 16px 32px var(--shadow);
      }

      .stat-card::before {
        content: "";
        position: absolute;
        inset: 0 auto auto 0;
        width: 120px;
        height: 120px;
        background: radial-gradient(circle, rgba(96, 165, 250, 0.2), transparent 70%);
      }

      .stat-label {
        position: relative;
        color: var(--muted);
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        margin-bottom: 12px;
      }

      .stat-value {
        position: relative;
        font-size: clamp(1.7rem, 3vw, 2.5rem);
        font-weight: 800;
        line-height: 1.1;
      }

      .stat-sub {
        position: relative;
        margin-top: 8px;
        color: var(--muted);
        font-size: 0.82rem;
      }

      .content-grid {
        display: grid;
        grid-template-columns: 1.4fr 0.9fr;
        gap: 20px;
      }

      .panel {
        background: rgba(15, 23, 42, 0.85);
        border: 1px solid var(--line);
        border-radius: 18px;
        box-shadow: 0 18px 38px var(--shadow);
        overflow: hidden;
      }

      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 16px 18px;
        border-bottom: 1px solid var(--line);
      }

      .panel-title {
        font-size: 1rem;
        font-weight: 700;
      }

      .panel-tag {
        background: rgba(96, 165, 250, 0.1);
        color: var(--primary);
        border: 1px solid rgba(96, 165, 250, 0.2);
        border-radius: 999px;
        padding: 6px 10px;
        font-size: 0.72rem;
        font-weight: 600;
      }

      .log-list {
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        max-height: 560px;
        overflow: auto;
      }

      .log-item {
        border: 1px solid var(--line);
        background: linear-gradient(180deg, rgba(17, 24, 39, 0.8), rgba(15, 23, 42, 0.95));
        border-radius: 14px;
        padding: 14px 14px 12px;
      }

      .log-top {
        display: flex;
        justify-content: space-between;
        gap: 12px;
      }

      .package-name {
        font-size: 0.95rem;
        font-weight: 700;
        color: var(--primary);
      }

      .event-badge {
        display: inline-flex;
        align-items: center;
        border-radius: 999px;
        padding: 5px 8px;
        font-size: 0.7rem;
        font-weight: 700;
        color: var(--success);
        background: rgba(52, 211, 153, 0.08);
        border: 1px solid rgba(52, 211, 153, 0.2);
      }

      .meta-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 9px;
        font-size: 0.8rem;
        color: var(--muted);
      }

      .meta-pill {
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 5px 8px;
        background: rgba(148, 163, 184, 0.04);
      }

      .summary-panel {
        padding: 18px;
      }

      .summary-box {
        background: rgba(17, 24, 39, 0.8);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px;
        margin-bottom: 12px;
      }

      .summary-box h3 {
        margin: 0 0 10px;
        font-size: 0.88rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .app-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .app-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 9px 10px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: rgba(148, 163, 184, 0.04);
      }

      .app-name {
        font-weight: 600;
        color: var(--text);
      }

      .app-count {
        font-weight: 700;
        color: var(--primary);
      }

      .live-dot {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--success);
        box-shadow: 0 0 12px rgba(52, 211, 153, 0.9);
        margin-right: 8px;
      }

      @media (max-width: 920px) {
        .content-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header class="header">
        <div class="brand">
          <div class="brand-mark">A</div>
          <h1>App Monitor</h1>
        </div>
        <div class="status-pill"><span class="status-dot"></span> Live monitoring</div>
      </header>

      <section class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">Total logs</div>
          <div id="totalLog" class="stat-value">0</div>
          <div class="stat-sub">Events recorded</div>
        </div>

        <div class="stat-card">
          <div class="stat-label">Devices</div>
          <div id="deviceCount" class="stat-value">0</div>
          <div class="stat-sub">Connected devices</div>
        </div>

        <div class="stat-card">
          <div class="stat-label">Latest device</div>
          <div id="deviceName" class="stat-value">-</div>
          <div class="stat-sub">Last seen device</div>
        </div>

        <div class="stat-card">
          <div class="stat-label">Last update</div>
          <div id="lastUpdate" class="stat-value">--:--</div>
          <div class="stat-sub">Timestamp</div>
        </div>
      </section>

      <section class="content-grid">
        <div class="panel">
          <div class="panel-header">
            <div class="panel-title">Recent activity</div>
            <div class="panel-tag">Realtime</div>
          </div>
          <div id="logs" class="log-list"></div>
        </div>

        <aside class="panel">
          <div class="panel-header">
            <div class="panel-title">Summary</div>
            <div class="panel-tag">AI insights</div>
          </div>

          <div class="summary-panel">
            <div class="summary-box">
              <h3>Most active apps</h3>
              <ul id="topApps" class="app-list"></ul>
            </div>

            <div class="summary-box">
              <h3>Current status</h3>
              <div class="meta-row" style="margin-top: 0;">
                <span class="meta-pill"><span class="live-dot"></span>System online</span>
                <span class="meta-pill" id="statusValue">waiting for data</span>
              </div>
            </div>
          </div>
        </aside>
      </section>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      const logsContainer = document.getElementById('logs');
      const totalLog = document.getElementById('totalLog');
      const deviceCount = document.getElementById('deviceCount');
      const deviceName = document.getElementById('deviceName');
      const lastUpdate = document.getElementById('lastUpdate');
      const topApps = document.getElementById('topApps');
      const statusValue = document.getElementById('statusValue');

      let logs = [];
      let summary = {
        totalLogs: 0,
        totalDevices: 0,
        latestDevice: '-',
        latestTimestamp: null,
        activeApps: []
      };

      function formatTime(iso) {
        if (!iso) return '--:--';
        const d = new Date(iso);
        return d.toLocaleString();
      }

      function renderSummary() {
        totalLog.textContent = String(summary.totalLogs ?? logs.length);
        deviceCount.textContent = String(summary.totalDevices ?? 0);
        deviceName.textContent = summary.latestDevice || '-';
        lastUpdate.textContent = summary.latestTimestamp ? formatTime(summary.latestTimestamp) : '--:--';

        if (summary.activeApps && summary.activeApps.length > 0) {
          const appItems = summary.activeApps
            .map((app, idx) => `
              <li class="app-item">
                <span class="app-name">${idx + 1}. ${app.name}</span>
                <span class="app-count">${app.count}</span>
              </li>
            `)
            .join('');
          topApps.innerHTML = appItems;
          statusValue.textContent = 'data received';
        } else {
          topApps.innerHTML = `
            <li class="app-item">
              <span class="app-name">No data yet</span>
              <span class="app-count">0</span>
            </li>
          `;
          statusValue.textContent = 'waiting for data';
        }
      }

      function renderLogs() {
        if (!logs.length) {
          logsContainer.innerHTML = `
            <div class="log-item">
              <div class="log-top">
                <div class="package-name">Waiting for first event</div>
                <div class="event-badge">idle</div>
              </div>
              <div class="meta-row">
                <span class="meta-pill">No activity yet</span>
              </div>
            </div>
          `;
          return;
        }

        logsContainer.innerHTML = logs.slice(0, 20).map((log) => {
          const packageName = log.packageName || 'unknown';
          const device = log.device || 'unknown';
          const event = log.event || 'heartbeat';
          const receivedAt = log.receivedAt || '-';

          return `
            <div class="log-item">
              <div class="log-top">
                <div class="package-name">${packageName}</div>
                <div class="event-badge">${event}</div>
              </div>

              <div class="meta-row">
                <span class="meta-pill">${device}</span>
                <span class="meta-pill">${formatTime(receivedAt)}</span>
              </div>
            </div>
          `;
        }).join('');
      }

      const socket = io();

      socket.on('history', (history) => {
        logs = Array.isArray(history) ? history.slice().reverse() : [];
        renderLogs();
      });

      socket.on('summary-update', (payload) => {
        summary = payload || summary;
        renderSummary();
      });

      socket.on('new-log', (log) => {
        logs.unshift(log);
        logs = logs.slice(0, 200);
        renderLogs();

        fetch('/api/summary')
          .then(res => res.json())
          .then(data => {
            summary = data;
            renderSummary();
          })
          .catch(() => {});
      });

      fetch('/api/summary')
        .then(res => res.json())
        .then(data => {
          summary = data;
          renderSummary();
        })
        .catch(() => {});
    </script>
  </body>
</html>
