version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: android-monitoring-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 3000
      NODE_ENV: production
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    container_name: android-monitoring-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
